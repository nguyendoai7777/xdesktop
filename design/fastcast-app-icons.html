<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu icon fastcast</title>
<style>
:root{--bg:#141414;--card:#1c1c1c;--text:#f5f5f5;--muted:#a3a3a3;--line:rgba(255,255,255,.08)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Segoe UI",sans-serif;padding:24px 16px}
h1{font-size:18px;font-weight:500;margin:0 0 4px}
p{color:var(--muted);margin:0 0 20px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;max-width:1100px}
.c{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;padding:14px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.c:hover{border-color:rgba(255,255,255,.25)}
.c.on{border-color:#F76B15;box-shadow:0 0 0 2px #F76B15}
.r{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0 16px;z-index:1}
#pick{color:#F76B15;font-weight:500}
</style>
</head>
